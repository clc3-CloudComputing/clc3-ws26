apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: demo
        image: agrimmer/demo:time
        ports:
          - name: web
            containerPort: 8888
            protocol: TCP